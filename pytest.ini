[pytest]
# Root directory for test discovery.
testpaths = tests

# Minimum pytest version required.
minversion = 7.4

# Default options applied to every run.
addopts = -ra --strict-markers --tb=short

# Custom markers — declare here to avoid PytestUnknownMarkWarning.
markers =
    integration: marks tests that require a live SAP HANA connection (deselect with -m "not integration")
    slow: marks tests that take more than 2 s
    smoke: marks the minimal set of tests that prove the suite can run

# Log output captured during test runs.
log_cli = true
log_cli_level = INFO
log_format = %(asctime)s %(levelname)-8s %(name)s: %(message)s
log_date_format = %Y-%m-%d %H:%M:%S
