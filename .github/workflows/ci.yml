# CI pipeline — runs on every pull request targeting main.
# Steps: install → lint → type-check → test.
# Any step that fails exits non-zero and blocks the merge.

name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main          # also run on direct pushes to main (e.g. after merge)

jobs:
  build:
    name: Install · Lint · Type-check · Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Python ───────────────────────────────────────────────────
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # ── 3. Install dependencies ────────────────────────────────────────────
      - name: Install runtime dependencies
        run: pip install --upgrade pip && pip install -r requirements.txt

      - name: Install dev / test dependencies
        run: pip install -r requirements-dev.txt

      # ── 4. Lint ────────────────────────────────────────────────────────────
      - name: Lint with flake8
        run: |
          # Stop the build on syntax errors or undefined names first.
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Then enforce the full style guide (max-line-length and ignores
          # come from .flake8 so the rule set is identical locally and in CI).
          flake8 . --count --statistics

      # ── 5. Type-check ──────────────────────────────────────────────────────
      - name: Type-check with mypy
        run: mypy .

      # ── 6. Test ────────────────────────────────────────────────────────────
      - name: Run tests with pytest
        env:
          # Fixtures-only mode — no live HANA connection in CI.
          RUN_INTEGRATION_TESTS: "0"
          LOG_LEVEL: "INFO"
        run: |
          pytest -v --tb=short --junitxml=test-results.xml

      # ── 7. Publish test results (always, so failures are visible) ──────────
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-py${{ matrix.python-version }}
          path: test-results.xml
          retention-days: 14
