# -- Flake8 -----------------------------------------------------------------
[flake8]
max-line-length = 120
extend-ignore = E203,W503
exclude =
    .venv,
    __pycache__,
    .git,
    data

# -- Mypy -------------------------------------------------------------------
[mypy]
python_version = 3.11
warn_return_any = True
warn_unused_configs = True
ignore_missing_imports = True
check_untyped_defs = True

# -- Pytest -----------------------------------------------------------------
[tool:pytest]
testpaths = tests
strict_markers = true
