[mypy]
# Target the same Python version as CI.
python_version = 3.11

# Strict-ish: catch the most common bugs without requiring stubs for every
# third-party library.
warn_return_any = True
warn_unused_configs = True
warn_unused_ignores = True
no_implicit_optional = True
strict_equality = True

# pandas, numpy, scipy and pytest do not ship inline stubs in all environments;
# suppress the import-untyped error for all of them.
[mypy-pandas.*]
ignore_missing_imports = True

[mypy-numpy.*]
ignore_missing_imports = True

[mypy-scipy.*]
ignore_missing_imports = True

[mypy-pytest.*]
ignore_missing_imports = True

# Test files — relax the return-type requirement (pytest fixtures return Any).
[mypy-tests.*]
disallow_untyped_defs = False
