<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vedanta Inventory Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <style>
    :root{--surface-page:#F8FAFC;--surface-primary:#FFFFFF;--surface-elevated:#FFFFFF;--border-default:rgba(15,23,42,0.08);--border-strong:rgba(15,23,42,0.15);--text-primary:#0F172A;--text-secondary:#475569;--text-muted:#94A3B8;--text-inverse:#FFFFFF;--accent:#2563EB;--accent-hover:#1D4ED8;--accent-subtle:#EFF6FF;--success-fg:#16A34A;--success-bg:#F0FDF4;--warning-fg:#D97706;--warning-bg:#FFFBEB;--danger-fg:#DC2626;--danger-bg:#FEF2F2;--info-fg:#0284C7;--info-bg:#F0F9FF;--neutral-fg:#64748B;--neutral-bg:#F1F5F9;--chart-1:#2563EB;--chart-2:#10B981;--chart-3:#F59E0B;--chart-4:#F43F5E;--chart-5:#8B5CF6;--font-sans:'Inter',system-ui,-apple-system,sans-serif;--radius-sm:6px;--radius-md:8px;--sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-6:24px;--sp-8:32px;--shadow-sm:0 1px 2px rgba(0,0,0,0.05);--shadow-md:0 4px 6px -1px rgba(0,0,0,0.07),0 2px 4px -2px rgba(0,0,0,0.05)}
    [data-theme="dark"]{--surface-page:#0F172A;--surface-primary:#1E293B;--surface-elevated:#334155;--border-default:rgba(248,250,252,0.08);--border-strong:rgba(248,250,252,0.15);--text-primary:#F8FAFC;--text-secondary:#CBD5E1;--text-muted:#64748B;--text-inverse:#0F172A;--accent:#3B82F6;--accent-hover:#60A5FA;--accent-subtle:rgba(59,130,246,0.1);--success-fg:#4ADE80;--success-bg:rgba(74,222,128,0.1);--warning-fg:#FBBF24;--warning-bg:rgba(251,191,36,0.1);--danger-fg:#F87171;--danger-bg:rgba(248,113,113,0.1);--info-fg:#38BDF8;--info-bg:rgba(56,189,248,0.1);--neutral-fg:#94A3B8;--neutral-bg:rgba(148,163,184,0.1);--chart-1:#3B82F6;--chart-2:#34D399;--chart-3:#FBBF24;--chart-4:#FB7185;--chart-5:#A78BFA}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:var(--font-sans);background:var(--surface-page);color:var(--text-primary);line-height:1.5}
    .container{max-width:1280px;margin:0 auto;padding:var(--sp-6)}
    header{display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--sp-8)}
    h1{font-size:24px;font-weight:600;letter-spacing:-0.01em}
    .subtitle{color:var(--text-secondary);font-size:14px}
    .theme-toggle{background:var(--surface-elevated);border:1px solid var(--border-default);border-radius:var(--radius-md);padding:var(--sp-2) var(--sp-3);cursor:pointer;color:var(--text-primary);font-family:var(--font-sans);font-size:14px;transition:background 200ms ease-out}
    .theme-toggle:hover{background:var(--accent-subtle)}
    .theme-toggle:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
    .grid{display:grid;gap:var(--sp-4)}.grid-4{grid-template-columns:repeat(4,1fr)}.grid-2{grid-template-columns:repeat(2,1fr)}
    .card{background:var(--surface-primary);border:1px solid var(--border-default);border-radius:var(--radius-md);padding:var(--sp-6);box-shadow:var(--shadow-sm)}
    .metric-value{font-size:32px;font-weight:700;line-height:1;letter-spacing:-0.02em}
    .metric-label{font-size:12px;font-weight:500;letter-spacing:0.05em;text-transform:uppercase;color:var(--text-muted);margin-bottom:var(--sp-2)}
    .flag-badge{display:inline-flex;align-items:center;gap:var(--sp-2);padding:var(--sp-1) var(--sp-3);border-radius:9999px;font-size:12px;font-weight:500}
    .flag-badge.success{color:var(--success-fg);background:var(--success-bg)}
    .flag-badge.warning{color:var(--warning-fg);background:var(--warning-bg)}
    .flag-badge.danger{color:var(--danger-fg);background:var(--danger-bg)}
    .flag-badge.info{color:var(--info-fg);background:var(--info-bg)}
    .flag-badge.neutral{color:var(--neutral-fg);background:var(--neutral-bg)}
    table{width:100%;border-collapse:collapse;font-size:14px}
    th{text-align:left;font-weight:500;color:var(--text-secondary);padding:var(--sp-3) var(--sp-4);border-bottom:1px solid var(--border-strong);position:sticky;top:0;background:var(--surface-primary)}
    td{padding:var(--sp-3) var(--sp-4);border-bottom:1px solid var(--border-default)}
    td.num{text-align:right;font-variant-numeric:tabular-nums}
    .table-scroll{max-height:400px;overflow-y:auto}
    .chart-container{position:relative;height:300px}
    .section-title{font-size:20px;font-weight:600;margin-bottom:var(--sp-4)}
    .search-input{width:100%;padding:var(--sp-2) var(--sp-3);border:1px solid var(--border-default);border-radius:var(--radius-sm);font-family:var(--font-sans);font-size:14px;background:var(--surface-primary);color:var(--text-primary);margin-bottom:var(--sp-4)}
    .search-input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
    @media(max-width:768px){.grid-4{grid-template-columns:repeat(2,1fr)}.grid-2{grid-template-columns:1fr}}
    @media(max-width:390px){.grid-4{grid-template-columns:1fr}.container{padding:var(--sp-4)}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:0ms!important;animation-duration:0ms!important}}
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div><h1>Vedanta Inventory Dashboard</h1><p class="subtitle">Stores &amp; Spares — Real-time SAP HANA Data</p></div>
      <button class="theme-toggle" aria-label="Toggle dark mode" onclick="toggleTheme()">🌙 Dark</button>
    </header>
    <div class="grid grid-4" id="metrics" style="margin-bottom:var(--sp-8)"></div>
    <div class="grid grid-2" style="margin-bottom:var(--sp-8)">
      <div class="card"><h2 class="section-title">Inventory by Plant</h2><div class="chart-container"><canvas id="plantChart"></canvas></div></div>
      <div class="card"><h2 class="section-title">Stock by Category</h2><div class="chart-container"><canvas id="categoryChart"></canvas></div></div>
    </div>
    <div class="grid grid-2" style="margin-bottom:var(--sp-8)">
      <div class="card"><h2 class="section-title">Days on Hand Distribution</h2><div class="chart-container"><canvas id="dohChart"></canvas></div></div>
      <div class="card"><h2 class="section-title">NMI / SMI Summary</h2><div class="chart-container"><canvas id="nmiChart"></canvas></div><div id="flagBadges" style="margin-top:var(--sp-4);display:flex;flex-wrap:wrap;gap:var(--sp-2)"></div></div>
    </div>
    <div class="card">
      <h2 class="section-title">Table Inventory</h2>
      <input type="text" class="search-input" placeholder="Search tables..." aria-label="Search tables" oninput="filterTables(this.value)" />
      <div class="table-scroll"><table><thead><tr><th>Table</th><th>Rows</th><th>Columns</th><th>Description</th></tr></thead><tbody id="tableBody"></tbody></table></div>
    </div>
  </div>
  <script>
    function toggleTheme(){const h=document.documentElement,b=document.querySelector('.theme-toggle');if(h.dataset.theme==='light'){h.dataset.theme='dark';b.textContent='☀️ Light'}else{h.dataset.theme='light';b.textContent='🌙 Dark'}}
    const fmt=n=>new Intl.NumberFormat('en-IN').format(n);
    const fmtCr=n=>'₹'+(n/1e7).toFixed(2)+' Cr';
    let allTables=[];
    function filterTables(q){const l=q.toLowerCase();document.getElementById('tableBody').innerHTML=allTables.filter(t=>t.table_name.toLowerCase().includes(l)||(t.description||'').toLowerCase().includes(l)).map(t=>'<tr><td>'+t.table_name+'</td><td class="num">'+fmt(t.row_count)+'</td><td class="num">'+t.column_count+'</td><td>'+(t.description||'')+'</td></tr>').join('')}
    async function loadJSON(f){return(await fetch('data/'+f)).json()}
    async function init(){
      const[manifest,inv,cat,doh,nmi]=await Promise.all([loadJSON('manifest.json'),loadJSON('inventory_by_plant.json'),loadJSON('stock_by_category.json'),loadJSON('days_on_hand.json'),loadJSON('nmi_smi_summary.json')]);
      const totalRows=manifest.tables.reduce((s,t)=>s+t.row_count,0);
      document.getElementById('metrics').innerHTML=[{label:'Tables',value:manifest.total_tables},{label:'Total Rows',value:fmt(totalRows)},{label:'Gross Inventory',value:fmtCr(inv.total_value)},{label:'Plants',value:inv.plants.length}].map(m=>'<div class="card"><p class="metric-label">'+m.label+'</p><p class="metric-value">'+m.value+'</p></div>').join('');
      allTables=manifest.tables;filterTables('');
      const cs=getComputedStyle(document.documentElement);
      const colors=[cs.getPropertyValue('--chart-1').trim(),cs.getPropertyValue('--chart-2').trim(),cs.getPropertyValue('--chart-3').trim(),cs.getPropertyValue('--chart-4').trim(),cs.getPropertyValue('--chart-5').trim()];
      new Chart(document.getElementById('plantChart'),{type:'bar',data:{labels:inv.plants.map(p=>p.plant_name),datasets:[{label:'Value (Cr)',data:inv.plants.map(p=>+(p.value/1e7).toFixed(2)),backgroundColor:colors[0]+'99',borderColor:colors[0],borderWidth:1}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}}});
      new Chart(document.getElementById('categoryChart'),{type:'bar',data:{labels:cat.categories.map(c=>c.category),datasets:[{label:'Value (Cr)',data:cat.categories.map(c=>+(c.value/1e7).toFixed(2)),backgroundColor:colors.concat(colors).slice(0,cat.categories.length).map(c=>c+'99'),borderWidth:1}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}}}});
      new Chart(document.getElementById('dohChart'),{type:'bar',data:{labels:doh.buckets.map(b=>b.range),datasets:[{label:'Materials',data:doh.buckets.map(b=>b.count),backgroundColor:[colors[3]+'99',colors[0]+'99',colors[1]+'99',colors[2]+'99',colors[4]+'99',colors[3]+'99'],borderWidth:1}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}}}});
      const sem={success:cs.getPropertyValue('--success-fg').trim(),warning:cs.getPropertyValue('--warning-fg').trim(),danger:cs.getPropertyValue('--danger-fg').trim(),info:cs.getPropertyValue('--info-fg').trim(),neutral:cs.getPropertyValue('--neutral-fg').trim()};
      new Chart(document.getElementById('nmiChart'),{type:'doughnut',data:{labels:nmi.flags.map(f=>f.label),datasets:[{data:nmi.flags.map(f=>f.count),backgroundColor:nmi.flags.map(f=>sem[f.semantic]+'33'),borderColor:nmi.flags.map(f=>sem[f.semantic]),borderWidth:2}]},options:{responsive:true,maintainAspectRatio:false}});
      document.getElementById('flagBadges').innerHTML=nmi.flags.map(f=>'<span class="flag-badge '+f.semantic+'">'+f.label+': '+fmt(f.count)+' ('+f.percentage+'%)</span>').join('');
    }
    init();
  </script>
</body>
</html>
